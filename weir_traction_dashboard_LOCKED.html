function b64d(s){const x=atob(s),b=new Uint8Array(x.length);for(let i=0;i<x.length;i++)b[i]=x.charCodeAt(i);return b;}
async function unlock(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pw),{name:"PBKDF2"},false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  let pt;
  try{pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(IV)},key,b64d(CT));}catch(e){return null;}
  return new TextDecoder().decode(pt);
}
async function go(){
  const pw=document.getElementById("pw").value;
  const btn=document.getElementById("go");const err=document.getElementById("err");
  if(!pw){err.textContent="Enter the password.";return;}
  btn.disabled=true;btn.textContent="Unlocking\u2026";err.textContent="";
  const html=await unlock(pw);
  if(!html){err.textContent="Wrong password.";btn.disabled=false;btn.textContent="Unlock";return;}
  window.__PW__=pw;
  document.open();document.write(html);document.close();
}
