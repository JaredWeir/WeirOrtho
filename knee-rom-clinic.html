<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Weir Orthopaedics — Movement Explorer (Clinic)</title>
<style>
  :root{
    --bg:#000;
    --fg:#ffffff;
    --muted:rgba(255,255,255,.65);
    --accent:#22a7e0; /* Weir blue */
    --panel:rgba(0,0,0,.55);
    --panel-border:rgba(255,255,255,.12);
    --good:#22c55e;
    --warn:#f59e0b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .mirrored #video,.mirrored #overlay{transform:scaleX(-1)}

  /* Top bar */
  .topbar{
    position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;
    padding:10px 14px;gap:8px;
  }
  .topbar .row{display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px}
  .topbar .left-stack{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .pill{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 12px;border-radius:999px;
    background:var(--panel);border:1px solid var(--panel-border);
    color:var(--fg);font-size:13px;font-weight:500;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    cursor:pointer;user-select:none;
  }
  .pill:active{transform:scale(.97)}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--panel-border);border-radius:999px;padding:3px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .seg button{
    background:transparent;border:0;color:var(--muted);
    padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .seg button.on{background:var(--accent);color:#001016}
  .icon{width:16px;height:16px;display:inline-block;vertical-align:-3px}

  /* HUD (now lives at the top, inside the topbar) */
  .hud-inner{
    display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:18px;padding:10px 14px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    min-width:min(520px,92vw);
  }
  .stat{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 4px}
  .stat .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .stat .val{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat .unit{font-size:14px;font-weight:500;color:var(--muted);margin-left:2px}
  .hud-inner .reset-col{display:flex;flex-direction:column;align-items:center;gap:2px}
  .hud-inner .reset-col .hint{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .hud-inner button.reset{
    background:var(--accent);color:#001016;border:0;border-radius:999px;
    padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
  }
  .hud-inner button.reset:active{transform:scale(.97)}

  /* Status overlay (loading / errors) */
  .center-msg{
    position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.7), rgba(0,0,0,.95));
    text-align:center;padding:24px;
  }
  .center-msg .card{
    max-width:420px;background:rgba(15,23,30,.9);border:1px solid var(--panel-border);
    border-radius:16px;padding:22px;
  }
  .center-msg h2{margin:0 0 8px;font-size:18px}
  .center-msg p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.45}
  .btn{
    display:inline-block;background:var(--accent);color:#001016;border:0;border-radius:999px;
    padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;
  }
  .spinner{width:22px;height:22px;border:2.5px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 10px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Calibration confirmation toast — small, top-center, slides down */
  .cal-flash{
    position:fixed;top:120px;left:50%;z-index:40;
    transform:translate(-50%,-12px);
    display:inline-flex;align-items:center;gap:10px;
    padding:8px 14px;border-radius:999px;
    background:rgba(0,0,0,.75);border:1px solid var(--accent);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    pointer-events:none;opacity:0;
    transition:opacity .25s ease, transform .25s ease;
  }
  .cal-flash.show{opacity:1;transform:translate(-50%,0)}
  .cal-flash img{display:block;height:22px;width:auto}
  .cal-flash .msg{font-size:12px;color:#fff;letter-spacing:.04em;white-space:nowrap}
  .cal-flash .msg b{color:var(--accent)}

  /* tiny helper */
  .hidden{display:none !important}

  /* Mobile-ish layout: applies to narrow screens AND any portrait device up to tablet size.
     Using both conditions so a phone in portrait always gets cleanup even if the browser
     misreports width (PWA / iframe quirks etc.). Landscape phones >600px wide skip these
     and keep the desktop-style layout, which is what we want. */
  @media (max-width:600px), (orientation:portrait) and (max-width:1024px), (orientation:landscape) and (max-height:500px){
    /* Smaller HUD: tighter padding, smaller numbers and labels */
    .hud-inner{padding:6px 10px;gap:6px;min-width:0;width:auto;max-width:96vw;border-radius:14px}
    .stat{padding:2px 2px}
    .stat .val{font-size:20px}
    .stat .lbl{font-size:9px;letter-spacing:.10em}
    .stat .unit{font-size:11px}
    .hud-inner button.reset{padding:6px 10px;font-size:11px}
    .hud-inner .reset-col{gap:0}

    /* Tighten side-selector / flip pills */
    .pill{font-size:12px;padding:6px 10px}
    .seg button{padding:5px 10px;font-size:12px}

    /* Hide the Flip button's text label — keep just the icon — to free space
       at top-right where the disclaimer also lives */
    #flipBtn{padding:7px 9px}
    #flipBtn > svg + *{display:none}

  }

  /* Brand decal — compact WEIRORTHO logo, centered at the bottom of the screen */
  .brand-decal{
    position:fixed;left:50%;bottom:env(safe-area-inset-bottom,0);z-index:8;
    transform:translateX(-50%);
    margin-bottom:24px;
    pointer-events:none;
    display:flex;align-items:center;justify-content:center;
  }
  .brand-decal img{
    display:block;
    height:110px;width:auto;
    filter:drop-shadow(0 3px 10px rgba(0,0,0,.6));
  }
  @media (max-width:600px), (orientation:portrait) and (max-width:1024px), (orientation:landscape) and (max-height:500px){
    .brand-decal{margin-bottom:14px}
    .brand-decal img{height:78px}
  }

  /* TUG (Timed Up and Go) timer — bottom-left */
  .tug{
    position:fixed;left:0;bottom:env(safe-area-inset-bottom,0);z-index:8;
    margin:14px 18px;
    background:rgba(0,0,0,.72);border:1px solid var(--panel-border);
    border-radius:14px;padding:10px 14px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:flex;flex-direction:column;align-items:center;gap:6px;
    min-width:150px;
  }
  .tug .tug-lbl{font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-weight:600}
  .tug .tug-time{
    font-size:34px;font-weight:700;color:#fff;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .tug .tug-time .unit{font-size:14px;color:var(--muted);font-weight:500;margin-left:2px}
  .tug .tug-btns{display:flex;gap:6px}
  .tug button{
    border:0;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;
    cursor:pointer;display:inline-flex;align-items:center;gap:5px;line-height:1;
  }
  .tug button.primary{background:var(--accent);color:#001016}
  .tug button.primary.running{background:#f59e0b;color:#1a0e00}
  .tug button.secondary{background:rgba(255,255,255,.14);color:#fff}
  .tug button:active{transform:scale(.95)}
  @media (max-width:600px), (orientation:portrait) and (max-width:1024px), (orientation:landscape) and (max-height:500px){
    .tug{margin:8px 10px;padding:7px 10px;min-width:120px}
    .tug .tug-time{font-size:26px}
    .tug button{padding:5px 11px;font-size:11px}
  }

  /* QR code — bottom-right, scannable. White background pad makes it readable
     against any camera background. */
  .qr-decal{
    position:fixed;right:0;bottom:env(safe-area-inset-bottom,0);z-index:8;
    margin:14px 18px;
    pointer-events:none;
    background:#fff;border-radius:8px;padding:6px;
    box-shadow:0 3px 10px rgba(0,0,0,.5);
    display:flex;align-items:center;
  }
  .qr-decal img{display:block;width:110px;height:110px}
  @media (max-width:600px), (orientation:portrait) and (max-width:1024px), (orientation:landscape) and (max-height:500px){
    .qr-decal{margin:8px 10px;padding:4px}
    .qr-decal img{width:78px;height:78px}
  }
</style>
</head>
<body>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<!-- Top: control row at the very top, then HUD below it -->
<div class="topbar">
  <div class="row" style="align-items:flex-start">
    <div class="left-stack">
      <div class="seg" id="sideSeg" role="tablist" aria-label="Knee side">
        <button data-side="left" class="on" aria-pressed="true">Left knee</button>
        <button data-side="right" aria-pressed="false">Right knee</button>
      </div>
    </div>
    <button class="pill hidden" id="flipBtn" title="Switch camera">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3.5-7.1"/><path d="M21 4v5h-5"/></svg>
      Flip
    </button>
  </div>
  <div class="hud-inner" role="region" aria-label="Knee range stats">
    <div class="stat">
      <div class="lbl">Max flexion</div>
      <div><span class="val" id="maxFlex">--</span><span class="unit">°</span></div>
    </div>
    <div class="reset-col">
      <button class="reset" id="resetBtn" title="Clear min/max and re-arm auto-calibration">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        Reset
      </button>
    </div>
    <div class="stat">
      <div class="lbl">Max extension</div>
      <div><span class="val" id="maxExt">--</span><span class="unit">°</span></div>
    </div>
  </div>
</div>


<!-- Calibration confirmation toast (small, top-center) -->
<div class="cal-flash" id="calFlash" aria-hidden="true">
  <img id="calFlashLogo" alt="Weir Orthopaedics" />
  <div class="msg"><b>Calibrated</b></div>
</div>

<!-- CLINIC build: take-home footer banner pinned at the bottom -->

<!-- Loading / permission gate -->
<div id="gate" class="center-msg">
  <div class="card">
    <div class="spinner"></div>
    <h2 id="gateTitle">Loading…</h2>
    <p id="gateBody">Loading the pose model — first load may take 20-30 seconds, then it's cached. Please allow camera access when prompted.</p>
    <button class="btn hidden" id="gateBtn">Allow camera</button>
  </div>
</div>

<!-- Inline SVG logo: deeper fallback if the embedded data URL fails to load -->
<svg id="logoSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" style="display:none">
  <g transform="translate(300,90)" fill="#22a7e0">
    <ellipse cx="0" cy="-70" rx="14" ry="22" transform="rotate(-15)"/>
    <ellipse cx="-22" cy="-58" rx="14" ry="22" transform="rotate(-35 -22 -58)" opacity=".85"/>
    <ellipse cx="22" cy="-58" rx="14" ry="22" transform="rotate(35 22 -58)" opacity=".85"/>
    <ellipse cx="-44" cy="-40" rx="14" ry="22" transform="rotate(-55 -44 -40)" opacity=".7"/>
    <ellipse cx="44" cy="-40" rx="14" ry="22" transform="rotate(55 44 -40)" opacity=".7"/>
    <ellipse cx="-30" cy="-25" rx="12" ry="18" transform="rotate(-20 -30 -25)" fill="#5cc2ea"/>
    <ellipse cx="30" cy="-25" rx="12" ry="18" transform="rotate(20 30 -25)" fill="#5cc2ea"/>
    <ellipse cx="0" cy="-30" rx="12" ry="18" fill="#1d8fc2"/>
  </g>
  <text x="300" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="140" fill="#22a7e0" letter-spacing="2">WEIR</text>
  <text x="300" y="295" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="600" font-size="44" fill="#1d8fc2" letter-spacing="6">ORTHOPAEDICS</text>
</svg>

<script type="module">

  PoseLandmarker,

const video    = document.getElementById('video');
const overlay  = document.getElementById('overlay');

const sideSeg  = document.getElementById('sideSeg');
const flipBtn  = document.getElementById('flipBtn');

const maxExtEl = document.getElementById('maxExt');

const logoImg = new Image();
logoImg.crossOrigin = 'anonymous';

function loadFallbackLogo(){
  const xml = new XMLSerializer().serializeToString(logoSvg);
  const blob = new Blob([xml], { type:'image/svg+xml;charset=utf-8' });
  logoImg.src = URL.createObjectURL(blob);
}

  logoImg.onerror = loadFallbackLogo;
  logoImg.src = LOGO_URL;
} else {

}

// ---------- UI wiring ----------
sideSeg.addEventListener('click', (e)=>{
  const b = e.target.closest('button[data-side]'); if(!b) return;
  state.side = b.dataset.side;
  state.smoothAngle = null;
  [...sideSeg.querySelectorAll('button')].forEach(x=>{
    const on = x.dataset.side===state.side;
    x.classList.toggle('on', on);
    x.setAttribute('aria-pressed', on?'true':'false');
  });
});

resetBtn.addEventListener('click', ()=>{
  // Reset clears running min/max and re-arms auto-calibration so the next time
  // the patient stands with both legs extended, we'll re-zero from that pose.
  state.maxFlex = -Infinity;
  state.minFlex = +Infinity;
  state.autoCalDone = false;
  state.standingSinceMs = null;
  maxFlexEl.textContent = '--';
  maxExtEl.textContent = '--';
});

// Branded calibration confirmation: brief overlay with logo + message.
const calFlashEl   = document.getElementById('calFlash');
const calFlashLogo = document.getElementById('calFlashLogo');
const brandDecalImg = document.getElementById('brandDecalImg');
// Brand decal uses the compact WEIRORTHO logo (separate from the calibration-toast logo)
brandDecalImg.src = BRAND_DECAL_DATA_URL;

let calFlashTimer = null;
function flashCalibration(){
  if (logoImg.src && calFlashLogo.src !== logoImg.src){
    calFlashLogo.src = logoImg.src;
  }
  calFlashEl.classList.add('show');
  if (calFlashTimer) clearTimeout(calFlashTimer);
  calFlashTimer = setTimeout(()=> calFlashEl.classList.remove('show'), 900);
}

flipBtn.addEventListener('click', async ()=>{
  // Switch which physical camera we want, then re-open it. The mirror state is
  // applied inside startCamera() based on the camera that ACTUALLY opens, so a
  // failed switch never leaves the preview lying about front/back.
  flipBtn.disabled = true;
  state.facing = state.facing==='user' ? 'environment' : 'user';
  try {
    await startCamera();
  } finally {
    flipBtn.disabled = false;
  }
});

// ---------- Pose model ----------
async function loadModel(){
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  state.poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions:{
      modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/1/pose_landmarker_heavy.task",
      delegate:"GPU"
    },
    runningMode:"VIDEO",
    numPoses:1
  });
}

// ---------- Camera ----------
// iPadOS Safari reports itself as DESKTOP, so we must NOT gate the camera-facing
// request on a user-agent "mobile" check (that was the old bug: Flip only toggled
// the mirror and re-opened the same camera). We always drive selection with
// facingMode, preferring an exact match so Flip reliably switches front<->back,
// and degrade gracefully on single-camera devices that can't satisfy 'exact'.
async function startCamera(){
  if(state.stream){ state.stream.getTracks().forEach(t=>t.stop()); state.stream=null; }

  const base = { width:{ ideal:1280 }, height:{ ideal:720 } };
  const get = (video) => navigator.mediaDevices.getUserMedia({ audio:false, video });

  try {
    try {
      // Force the requested camera so the Flip actually changes lenses.
      state.stream = await get({ ...base, facingMode:{ exact: state.facing } });
    } catch (exactErr) {
      // Most laptops have a single camera that can't satisfy exact:'environment'.
      // Fall back to a soft preference, then to whatever camera is available.
      try {
        state.stream = await get({ ...base, facingMode:{ ideal: state.facing } });
      } catch (idealErr) {
        state.stream = await get(base);
      }
    }
  } catch (err){
    showGate('Camera blocked', 'We need camera access to measure knee range of motion. Please allow camera permissions in your browser and reload.', 'Try again', () => location.reload());
    throw err;
  }

  video.srcObject = state.stream;
  await new Promise(res => { video.onloadedmetadata = ()=>{ video.play(); res(); }; });
  syncMirrorFromTrack();
  resizeCanvas();
}

// Mirror only the front ("selfie") camera so the clinician sees themselves
// mirror-style; the rear camera (recording the patient) stays un-mirrored.
// We read the camera that ACTUALLY opened rather than what we asked for, so the
// preview never claims to be flipped when the switch didn't take.
function syncMirrorFromTrack(){
  const track = state.stream && state.stream.getVideoTracks ? state.stream.getVideoTracks()[0] : null;
  const fm = track && track.getSettings ? track.getSettings().facingMode : undefined;
  const facing = (fm === 'user' || fm === 'environment') ? fm : state.facing;
  state.facing = facing;
  stage.classList.toggle('mirrored', facing === 'user');
}

function resizeCanvas(){
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  overlay.width  = Math.round(r.width  * dpr);
  overlay.height = Math.round(r.height * dpr);
  overlay.style.width  = r.width + 'px';
  overlay.style.height = r.height + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', ()=>setTimeout(resizeCanvas,250));

function videoToCanvas(nx, ny){
  const r = stage.getBoundingClientRect();
  const vw = video.videoWidth, vh = video.videoHeight;
  if(!vw || !vh) return { x:0, y:0 };
  const scale = Math.max(r.width / vw, r.height / vh);
  const dispW = vw * scale, dispH = vh * scale;
  const offX = (r.width  - dispW) / 2;
  const offY = (r.height - dispH) / 2;
  return { x: offX + nx * dispW, y: offY + ny * dispH };
}

// ---------- Smoothing ----------
const SMOOTH_ALPHA = 0.45;
const smoothCache = new Map();
function smooth(key, p){
  if (!p) return p;
  const prev = smoothCache.get(key);
  if (!prev){
    const copy = { x:p.x, y:p.y, z:p.z||0, visibility:p.visibility };
    smoothCache.set(key, copy);
    return copy;
  }
  prev.x = prev.x + (p.x - prev.x) * SMOOTH_ALPHA;
  prev.y = prev.y + (p.y - prev.y) * SMOOTH_ALPHA;
  prev.z = (prev.z||0) + ((p.z||0) - (prev.z||0)) * SMOOTH_ALPHA;
  if (p.visibility !== undefined) prev.visibility = p.visibility;
  return prev;
}
function resetSmoothing(){ smoothCache.clear(); }

// ---------- Display bucketing ----------
// Round to tens. Two boundary rules requested:
//   • anything < 9°  → 0   (so a near-extension reading reads as "0")
//   • anything ≥ 81° → 90  (so reaching the celebration zone shows as "90"
//                           even before the model says exactly 90)
// Above 90 we keep rounding to nearest 10 (95→100, 105→110, …).
function bucketAngle(v){
  // 5° display granularity (heavier MMC model is accurate enough to resolve this).
  // 0-2  → 0;  3-7 → 5;  8-12 → 10; ...
  return Math.max(0, Math.round(v / 5) * 5);
}

// ---------- Math ----------
function angleDeg(a,b,c){
  const az=a.z||0, bz=b.z||0, cz=c.z||0;
  const abx=a.x-b.x, aby=a.y-b.y, abz=az-bz;
  const cbx=c.x-b.x, cby=c.y-b.y, cbz=cz-bz;
  const dot = abx*cbx + aby*cby + abz*cbz;
  const m1 = Math.sqrt(abx*abx+aby*aby+abz*abz);
  const m2 = Math.sqrt(cbx*cbx+cby*cby+cbz*cbz);
  if(!m1 || !m2) return NaN;
  const cos = Math.max(-1, Math.min(1, dot/(m1*m2)));
  return Math.acos(cos) * 180/Math.PI;
}

// ---------- Drawing ----------
function drawSkeleton(hip, knee, ankle, kneeAngleClinical){
  ctx.lineWidth = 6;
  ctx.strokeStyle = '#22a7e0';
  ctx.beginPath();
  ctx.moveTo(hip.x, hip.y);
  ctx.lineTo(knee.x, knee.y);
  ctx.lineTo(ankle.x, ankle.y);
  ctx.stroke();

  for(const p of [hip, knee, ankle]){
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#22a7e0';
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
  }

  // Bucketed display value (tens-of-degrees). Background turns blue at 0 and 90+.
  const displayed = bucketAngle(kneeAngleClinical);
  const isHighlight = (displayed === 0) || (displayed >= 90);
  const label = `${displayed}°`;

  ctx.save();
  ctx.font = '700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.textBaseline = 'middle';
  const padX=10, padY=6;
  const m = ctx.measureText(label);
  const tw = m.width + padX*2, th = 28 + padY*2;
  const dx = (hip.x + ankle.x)/2 - knee.x;
  const dy = (hip.y + ankle.y)/2 - knee.y;
  const len = Math.hypot(dx,dy) || 1;
  const cx = knee.x + (-dx/len * 70);
  const cy = knee.y + (-dy/len * 70);
  ctx.translate(cx, cy);
  if(stage.classList.contains('mirrored')) ctx.scale(-1, 1);

  // Chip background — accent blue for the "good" ranges (extension and ≥90°),
  // black otherwise. Border switches color so it's always visible.
  ctx.fillStyle   = isHighlight ? 'rgba(34,167,224,.92)' : 'rgba(0,0,0,.75)';
  roundRect(ctx, -tw/2, -th/2, tw, th, 10); ctx.fill();
  ctx.strokeStyle = isHighlight ? 'rgba(255,255,255,.95)' : 'rgba(34,167,224,.9)';
  ctx.lineWidth = 2;
  roundRect(ctx, -tw/2, -th/2, tw, th, 10); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText(label, -tw/2 + padX, 1);
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}


// ---------- Status / gate ----------
function hideGate(){ gate.classList.add('hidden'); }
function showGate(title, body, btnText, onClick){
  gate.classList.remove('hidden');
  gateTitle.textContent = title;
  gateBody.textContent = body;
  if(btnText){
    gateBtn.textContent = btnText;
    gateBtn.classList.remove('hidden');
    gateBtn.onclick = onClick;
    gate.querySelector('.spinner').classList.add('hidden');
  } else {
    gateBtn.classList.add('hidden');
    gate.querySelector('.spinner').classList.remove('hidden');
  }
}

// ---------- Auto-calibration (continuous, opposite-leg reference) ----------
// Standard supine knee-ROM protocol: the un-tested leg stays extended throughout.
// Whatever the model reads on that leg IS the model's bias at the current pose,
// because the reference leg's true flexion is 0°. We subtract that from the
// active leg to recover an unbiased angle. Works lying, sitting upright, or
// standing — no posture detection needed.
//
// Assumption: the opposite leg stays roughly extended (raw flexion < OPP_MAX_FLEX).
// If it isn't (patient bent both legs), we hold the last good calibration.
const OPP_MAX_FLEX = 30;        // skip update if reference leg looks bent
const OPP_VIS_MIN  = 0.5;       // visibility threshold on opposite leg
const OPP_DRIFT    = 0.06;      // exponential update rate for slow self-correction

// Convert a normalized landmark (x,y in 0..1) to image-pixel coords so the
// 2D angle math isn't distorted by the video aspect ratio.
function lmPx(p){
  const vw = video.videoWidth || 1280;
  const vh = video.videoHeight || 720;
  return { x: p.x * vw, y: p.y * vh };
}

function tryAutoCalibrate(lm){
  // Pick the LANDMARK INDICES of the opposite (un-tested) leg
  const opp = state.side === 'left'
    ? { hip:24, knee:26, ankle:28 }   // active = left, reference = right
    : { hip:23, knee:25, ankle:27 };  // active = right, reference = left

  const vis = (p) => p && (p.visibility === undefined || p.visibility > OPP_VIS_MIN);
  if (!vis(lm[opp.hip]) || !vis(lm[opp.knee]) || !vis(lm[opp.ankle])) return;

  // 2D image-space angle (aspect-corrected). For supine ROM the leg moves in
  // the camera's image plane, so 2D is more accurate than the noisier 3D
  // worldLandmarks depth estimate.
  const inner = angleDeg(lmPx(lm[opp.hip]), lmPx(lm[opp.knee]), lmPx(lm[opp.ankle]));
  if (!isFinite(inner)) return;
  const oppFlex = 180 - inner;

  // If the reference leg is itself flexed, we can't trust it as a 0° baseline.
  // Hold the last calibration and wait for them to extend it again.
  if (oppFlex > OPP_MAX_FLEX) return;

  // Don't drift the calibration during a rep. Only update when the ACTIVE leg
  // is also near extension — that way the offset only refreshes between reps,
  // not during deep flexion (which was making max-flex readings shrink).
  const activeRaw = state.smoothAngle != null ? state.smoothAngle : 0;

  if (!state.autoCalDone){
    // First valid sample — lock it in and announce the calibration with a toast.
    state.calibrationOffset = oppFlex;
    state.autoCalDone = true;
    state.maxFlex = -Infinity;
    state.minFlex = +Infinity;
    maxFlexEl.textContent = '--';
    maxExtEl.textContent  = '--';
    flashCalibration();
  } else if (activeRaw < 40) {
    // Continuous slow update — only when active leg is near extension.
    state.calibrationOffset = state.calibrationOffset * (1 - OPP_DRIFT) + oppFlex * OPP_DRIFT;
  }
}

// ---------- Main loop ----------
function pickSide(landmarks){
  const idx = state.side === 'left'
    ? { hip:23, knee:25, ankle:27 }
    : { hip:24, knee:26, ankle:28 };
  return {
    hip: landmarks[idx.hip],
    knee: landmarks[idx.knee],
    ankle: landmarks[idx.ankle],
  };
}

function loop(){
  if(!state.poseLandmarker || video.readyState < 2){
    requestAnimationFrame(loop);
    return;
  }
  const t = video.currentTime;
  if(t !== state.lastVideoTime){
    state.lastVideoTime = t;
    const result = state.poseLandmarker.detectForVideo(video, performance.now());
    ctx.clearRect(0,0,overlay.width,overlay.height);

    if(result && result.landmarks && result.landmarks[0]){
      const rawLm = result.landmarks[0];
      const rawWlm = result.worldLandmarks && result.worldLandmarks[0];

      const lm  = rawLm.map((p, i)  => smooth('lm:'+i,  p));
      const wlm = rawWlm ? rawWlm.map((p, i) => smooth('wlm:'+i, p)) : null;

      const sel = pickSide(lm);

      const vis = (p)=> p && (p.visibility===undefined || p.visibility>0.4);
      if(vis(sel.hip) && vis(sel.knee) && vis(sel.ankle)){
        const hipP   = videoToCanvas(sel.hip.x,   sel.hip.y);
        const kneeP  = videoToCanvas(sel.knee.x,  sel.knee.y);
        const ankleP = videoToCanvas(sel.ankle.x, sel.ankle.y);

        // 2D image-space angle (aspect-corrected) — see lmPx() / tryAutoCalibrate
        // for why 2D beats 3D worldLandmarks for in-plane supine motion.
        const inner = angleDeg(lmPx(sel.hip), lmPx(sel.knee), lmPx(sel.ankle));
        const flexion = 180 - inner;

        state.smoothAngle = state.smoothAngle==null ? flexion : (state.smoothAngle*0.7 + flexion*0.3);

        // Try auto-calibration BEFORE applying the offset so we capture the raw bias.
        tryAutoCalibrate(lm);

        const corrected = state.smoothAngle - state.calibrationOffset;
        const shown = Math.max(0, corrected);

        drawSkeleton(hipP, kneeP, ankleP, shown);

        if(shown > state.maxFlex){ state.maxFlex = shown; maxFlexEl.textContent = bucketAngle(shown); }
        if(shown < state.minFlex){ state.minFlex = shown; maxExtEl.textContent  = bucketAngle(shown); }

      } else {
      }
    } else {
    }
  }
  requestAnimationFrame(loop);
}

// ---------- Init ----------
async function init(){
  // Clinic: Flip button is always visible (iPad Safari may report as desktop,
  // so the mobile gate would hide it). Rear camera is the default — clinician
  // records the patient with the back camera — so no initial mirror.
  flipBtn.classList.remove('hidden');
  try {
    gateTitle.textContent = 'Loading pose model…';
    await loadModel();
    gateTitle.textContent = 'Starting camera…';
    await startCamera();
    hideGate();
    requestAnimationFrame(loop);
  } catch(err){
    console.error(err);
    if(!gate.classList.contains('hidden')) return;
    showGate('Something went wrong', String(err && err.message || err), 'Retry', ()=>location.reload());
  }
}

function preflight(){
  const needsGesture = /iP(ad|hone|od)/.test(navigator.userAgent);
  if(needsGesture){
    showGate('Knee range of motion', 'Tap Start to enable the camera. Position yourself so your hip, knee, and ankle are all in view.', 'Start', ()=>{ gateBtn.classList.add('hidden'); gate.querySelector('.spinner').classList.remove('hidden'); init(); });
  } else {
    init();
  }
}
// ---------- TUG (Timed Up and Go) timer ----------
// Stopwatch behaviour: a single button toggles Start↔Stop; a separate Reset
// wipes it back to 0.00s. Accumulated time persists across stops so you can
// pause and resume — Reset is the only thing that clears the time.
const tugTimeEl    = document.getElementById('tugTime');
const tugToggleBtn = document.getElementById('tugToggleBtn');
const tugToggleLbl = document.getElementById('tugToggleLabel');
const tugIcon      = document.getElementById('tugIcon');
const tugResetBtn  = document.getElementById('tugResetBtn');

const TUG_PLAY_PATH  = 'M2 1.5l6 3.5-6 3.5z';
const TUG_PAUSE_PATH = 'M2 1.5h2.4v7H2zM5.6 1.5H8v7H5.6z';

const tug = { running:false, startedAt:0, accumulated:0, rafId:null };

function tugFmt(ms){ return (ms / 1000).toFixed(1); }
function tugTick(){
  const elapsed = tug.accumulated + (tug.running ? (performance.now() - tug.startedAt) : 0);
  tugTimeEl.textContent = tugFmt(elapsed);
  if (tug.running) tug.rafId = requestAnimationFrame(tugTick);
}
function tugStart(){
  tug.startedAt = performance.now();
  tug.running = true;
  tugToggleLbl.textContent = 'Stop';
  tugIcon.querySelector('path').setAttribute('d', TUG_PAUSE_PATH);
  tugToggleBtn.classList.add('running');
  tugTick();
}
function tugStop(){
  tug.accumulated += performance.now() - tug.startedAt;
  tug.running = false;
  if (tug.rafId) cancelAnimationFrame(tug.rafId);
  tugToggleLbl.textContent = 'Start';
  tugIcon.querySelector('path').setAttribute('d', TUG_PLAY_PATH);
  tugToggleBtn.classList.remove('running');
  tugTick(); // one final paint with the final value
}
function tugReset(){
  if (tug.running) tugStop();
  tug.accumulated = 0;
  tug.startedAt = 0;
  tugTimeEl.textContent = '0.0';
}
tugToggleBtn.addEventListener('click', () => tug.running ? tugStop() : tugStart());
tugResetBtn .addEventListener('click', tugReset);

preflight();
</script>
